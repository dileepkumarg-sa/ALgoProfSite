{% extends "core/base.html" %}
{% load static %}

{% block content %}
<div class="products-section">
  <h1>Our Products</h1>
  <p class="subtitle">Innovative tools and solutions coming soon...</p>

  <div class="product-grid">
    <!-- Placeholder Cards -->
    <div class="product-card">
      <img src="{% static 'images/placeholder.png' %}" alt="Product Coming Soon">
      <h3>Product Name</h3>
      <p>Brief description of the product. Details will be updated soon.</p>
    </div>

    <div class="product-card">
      <img src="{% static 'images/placeholder.png' %}" alt="Product Coming Soon">
      <h3>Product Name</h3>
      <p>Another upcoming product with exciting features.</p>
    </div>
  </div>
</div>
  
<style>
.products-section {
  max-width: 1100px;
  margin: 50px auto;
  padding: 20px;
  text-align: center;
}

.products-section h1 {
  font-size: 2.5em;
  color: #2c3e50;
}

.subtitle {
  font-size: 1.1em;
  color: #666;
  margin-bottom: 40px;
}

.product-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 30px;
}

.product-card {
  width: 260px;
  padding: 20px;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  text-align: center;
}

.product-card img {
  width: 100%;
  height: auto;
  border-radius: 8px;
  margin-bottom: 15px;
}

.product-card h3 {
  color: #4CAF50;
  margin-bottom: 10px;
}

.product-card p {
  color: #555;
  font-size: 0.95em;
  line-height: 1.5;
}
</style>
{% endblock %}
