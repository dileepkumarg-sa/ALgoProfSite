{% extends "core/base.html" %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Login to Your Account</h2>

    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="form-group">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <div class="error">{{ field.errors|striptags }}</div>
          {% endif %}
        </div>
      {% endfor %}

      <button type="submit" class="submit-btn">Login</button>
    </form>

    <p class="footer-text">Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
  </div>
</div>

<style>
  .auth-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 100px);
    background-color: #f2f5f7;
    padding: 40px 15px;
  }

  .auth-card {
    background: white;
    padding: 40px 35px;
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    max-width: 500px;
    width: 100%;
  }

  .auth-card h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #333;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
  }

  .form-group input {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 6px;
    transition: border 0.2s;
  }

  .form-group input:focus {
    border-color: #4CAF50;
    outline: none;
  }

  .error {
    color: red;
    font-size: 13px;
    margin-top: 5px;
  }

  .submit-btn {
    width: 100%;
    background-color: #4CAF50;
    color: white;
    padding: 12px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.3s;
  }

  .submit-btn:hover {
    background-color: #43a047;
  }

  .footer-text {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
  }

  .footer-text a {
    color: #2196F3;
    text-decoration: none;
  }

  .footer-text a:hover {
    text-decoration: underline;
  }
</style>
{% endblock %}
